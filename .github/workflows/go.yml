name: Go validation

on:
  push:
    branches: [main, "feat/go-foundation"]
  pull_request:

permissions:
  contents: read

env:
  # Use the audited Go binary; do not silently download another toolchain.
  GOTOOLCHAIN: local

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: compute-ci
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, immutable commit
        with:
          # Do not represent synthetic PR-merge checkout as source-HEAD proof.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source checkout for release fence
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD)"
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "source checkout mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual" >&2
            exit 1
          fi
          printf 'verified_release_fence_source_sha=%s\n' "$actual"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, immutable commit
        with:
          go-version: '1.27.4'
          cache: false
      - name: Assert patched Go toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.27.4"
          go version
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Show Go formatting diff on failure
        if: failure()
        shell: bash
        run: |
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            printf 'Go formatting diff for %s:\n' "$file"
            gofmt -d "$file"
          done < <(gofmt -l .)
      - name: Test cross-branch migration compatibility policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify module checksums
        run: go mod verify
      - name: Provision dedicated database roles in disposable CI database
        env:
          PGPASSWORD: compute-ci
        run: >-
          psql --host=127.0.0.1 --username=postgres --dbname=postgres
          --set=ON_ERROR_STOP=1
          --command="CREATE ROLE ccp_provider_audit_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          --command="CREATE ROLE ccp_kueue_job_binding LOGIN PASSWORD 'kueue-binding-ci-only' NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          --command="CREATE ROLE ccp_dra_receipt_ingest LOGIN PASSWORD 'dra-ingest-ci-only' NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
      - name: Apply PostgreSQL migrations (checksummed runner, run twice for idempotency)
        env:
          DATABASE_URL: postgres://postgres:compute-ci@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
      - name: Validate PostgreSQL schema constraints
        env:
          PGPASSWORD: compute-ci
        run: psql --host=127.0.0.1 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 --file=migrations/tests/0001_compute_core_constraints.sql
      - name: Static analysis
        run: go vet ./...
      - name: Require real PostgreSQL release Generation/UID fence test (no skip)
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:compute-ci@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          go test -count=1 -v -run '^TestReleaseCommitFenceMatchesLivePostgresGenerationAndUID$' ./internal/store/postgres | tee release-fence-pg.log
          grep -F -- '--- PASS: TestReleaseCommitFenceMatchesLivePostgresGenerationAndUID' release-fence-pg.log
          if grep -F -- '--- SKIP: TestReleaseCommitFenceMatchesLivePostgresGenerationAndUID' release-fence-pg.log; then
            echo 'real PostgreSQL release fence test skipped: no evidence' >&2
            exit 1
          fi
      - name: Race-enabled tests
        env:
          DATABASE_URL: postgres://postgres:compute-ci@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...
      - name: SIGKILL recovery repeatability
        env:
          DATABASE_URL: postgres://postgres:compute-ci@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race -count=3 -run '^TestSIGKILLRecoveryLeaseIsFencedBeforeInspection$' ./internal/recovery
