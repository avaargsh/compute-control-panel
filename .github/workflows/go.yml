name: Go validation

on:
  push:
    branches: [main, "feat/go-foundation"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable commit
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, immutable commit
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify gofmt without mutating the checkout
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.go')
          if (("${#files[@]}" > 0)); then
            unformatted="$(gofmt -l "${files[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf 'Go files require gofmt:\n%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Verify module checksums
        run: go mod verify
      - name: Static analysis
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race -count=1 ./...
