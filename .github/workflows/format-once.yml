name: One-time outbox Go formatting

on:
  push:
    branches: ["feat/go-foundation"]
    paths: [".github/workflows/format-once.yml"]

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'avaargsh/compute-control-panel' && github.ref == 'refs/heads/feat/go-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6
        with:
          ref: feat/go-foundation
          persist-credentials: true
      - name: Format only tracked Go source and commit
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.go' | xargs -0 -r gofmt -w
          if git diff --quiet -- '*.go'; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "style(compute): normalize outbox source and tests"
          git push origin HEAD:feat/go-foundation
