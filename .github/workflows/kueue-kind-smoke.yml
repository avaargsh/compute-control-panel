name: Kueue real-controller kind smoke (no GPU readiness claim)

on:
  pull_request:
    paths:
      - '.github/workflows/kueue-kind-smoke.yml'
      - 'scripts/kueue_kind_smoke.sh'
      - 'scripts/kueue_relist_kind_smoke.sh'
      - 'scripts/dra_example_kind_smoke.sh'
      - 'scripts/kueue_preemption_kind_smoke.sh'
      - 'cmd/kueue-observe/**'
      - 'cmd/kueue-provider-smoke/**'
      - 'internal/provider/kueue_*.go'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kueue-kind-smoke.yml'
      - 'scripts/kueue_kind_smoke.sh'
      - 'scripts/kueue_relist_kind_smoke.sh'
      - 'scripts/dra_example_kind_smoke.sh'
      - 'scripts/kueue_preemption_kind_smoke.sh'
      - 'cmd/kueue-observe/**'
      - 'cmd/kueue-provider-smoke/**'
      - 'internal/provider/kueue_*.go'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use the audited Go binary; do not silently download another toolchain.
  GOTOOLCHAIN: local

jobs:
  disposable-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 immutable commit
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 immutable commit
        with:
          go-version: '1.27.4'
          cache: false
      - name: Assert patched Go toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.27.4"
          go version
      - name: Install kind v0.30.0 (module-verified)
        run: |
          go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check shell syntax before starting Docker
        run: |
          bash -n scripts/kueue_kind_smoke.sh
          bash -n scripts/dra_example_kind_smoke.sh
          bash -n scripts/kueue_relist_kind_smoke.sh
          bash -n scripts/kueue_preemption_kind_smoke.sh
      - name: Kubernetes 1.34 / Kueue v0.19.6 + simulated DRA v0.2.0 + PG16 (disposable)
        env:
          CCP_DISPOSABLE_KIND_SMOKE: '1'
        run: bash scripts/kueue_kind_smoke.sh
